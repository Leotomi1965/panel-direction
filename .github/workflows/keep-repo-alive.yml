name: Keep repo alive

# GitHub deshabilita automáticamente los workflows programados (cron) de un repo
# si pasan 60 días sin ningún commit. Este workflow hace un commit trivial una
# vez por mes (bien por debajo del límite) para que eso nunca pase — así el
# heartbeat de Supabase (.github/workflows/supabase-heartbeat.yml) se sostiene
# solo, sin depender de que la app reciba actualizaciones seguido.
#
# Solo toca .github/keepalive.txt. vercel.json (ignoreCommand) hace que Vercel
# saltee el build/deploy cuando el único cambio del commit está dentro de
# .github/ — no dispara ningún deploy.

on:
  schedule:
    - cron: '0 8 1 * *' # día 1 de cada mes, 08:00 UTC
  workflow_dispatch: {} # permite disparar manualmente para probar

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar .github/keepalive.txt
        run: |
          {
            echo "Este archivo lo actualiza automáticamente .github/workflows/keep-repo-alive.yml"
            echo "una vez por mes, solo para que el repo nunca llegue a 60 días sin commits (límite"
            echo "en el que GitHub deshabilita los workflows programados). No tiene ningún otro uso."
            echo ""
            echo "Última actualización automática: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > .github/keepalive.txt

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Sin cambios (ya se había actualizado este mes) — nada que commitear."
            exit 0
          fi
          git commit -m "chore: keepalive mensual (mantener workflows programados activos)"
          git push
